<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
   <title>Isometric Cube Field</title>
   <style>
      html,
      body {
         margin: 0;
         height: 100%;
         background: #ffffff;
         overflow: hidden;
      }

      canvas {
         display: block;
         width: 100vw;
         height: 100vh;
         touch-action: none;
      }
   </style>
</head>

<body>
   <canvas id="scene"></canvas>

   <script>
      (() => {
         const canvas = document.getElementById('scene');
         const ctx = canvas.getContext('2d');

         // ---------- Config ----------
         const N = 4;                 // footprint size (N x N)
         const L = 4;                 // number of layers
         const BLUE_LAYER = 2;        // layer index that carries accent cubes
         const BREATH_PERIOD = 6;     // seconds for one full inhale/exhale
         const GAP_MIN = 0.04;        // resting gap (in cube units)
         const GAP_MAX = 0.16;        // maximum breathing gap
         const EXPLODE_EXTRA = 0.35;  // compact vertical spacing per layer on hover
         const INTRO_DURATION = 0.9;  // seconds for each cube to settle
         const INTRO_STAGGER = 0.045; // delay between cubes
         const DROP_HEIGHT = 14;      // starting height (in cube units) for intro fall

         const UW = Math.cos(Math.PI / 6); // isometric horizontal factor
         const UH = 0.5;                   // isometric depth factor

         const COLORS = {
            white: { top: '#f3f3f1', left: '#e7e7e4', right: '#dadad6' },
            blue: { top: '#5a6cff', left: '#2a3df2', right: '#1b2bd1' }
         };
         const STROKE = '#1c1c1c';
         const FLOOR_STROKE = '#9a9a9a';

         const LAYER_LABELS = [
            { text: '01 SOURCES', k: 0, blue: false },
            { text: '02 LOGIC', k: 1, blue: false },
            { text: '03 AGENTS', k: 2, blue: true },
            { text: '04 SURFACES', k: 3, blue: false }
         ];

         // Pseudo-random function with seed
         function mulberry32(a) {
            return function () {
               let t = a += 0x6D2B79F5;
               t = Math.imul(t ^ (t >>> 15), t | 1);
               t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
               return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
         }
         const rand = mulberry32(42);

         // ---------- Build cubes ----------
         const cubes = [];
         for (let k = 0; k < L; k++) {
            for (let i = 0; i < N; i++) {
               for (let j = 0; j < N; j++) {
                  // Base delay per layer with organic random jitter across cells
                  const baseLayerDelay = k * 0.42;
                  const cellJitter = rand() * 0.45;
                  const randomHeightOffset = (rand() - 0.5) * 5.5; // scattered altitude like in image 2

                  cubes.push({
                     i, j, k,
                     blue: k === BLUE_LAYER,
                     delay: baseLayerDelay + cellJitter,
                     startDrop: DROP_HEIGHT + randomHeightOffset
                  });
               }
            }
         }

         // Painter's algorithm: sort back-to-front (lowest depth first)
         const drawOrder = cubes.slice().sort((a, b) => {
            const depthA = (a.i + a.j) + a.k * 0.001;
            const depthB = (b.i + b.j) + b.k * 0.001;
            return depthA - depthB;
         });

         let width = 0;
         let height = 0;
         let dpr = 1;

         function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
         }
         window.addEventListener('resize', resize);
         resize();

         let hovered = false;
         let hoverProgress = 0;

         window.addEventListener('pointerenter', () => { hovered = true; });
         window.addEventListener('pointerleave', () => { hovered = false; });
         window.addEventListener('pointermove', (e) => {
            const cx = width / 2;
            const cy = height / 2;
            const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
            hovered = dist < Math.min(width, height) * 0.38;
         });

         function easeOutCubic(t) {
            return 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);
         }

         function project(x, y, z, size) {
            const isoX = (x - y) * UW * size;
            const isoY = (x + y) * UH * size - z * size;
            return { x: width / 2 + isoX, y: height / 2 + isoY };
         }

         function drawCube(x, y, z, size, palette) {
            const p0 = project(x, y, z + 1, size);
            const p1 = project(x + 1, y, z + 1, size);
            const p2 = project(x + 1, y + 1, z + 1, size);
            const p3 = project(x, y + 1, z + 1, size);

            const b0 = project(x, y, z, size);
            const b1 = project(x + 1, y, z, size);
            const b2 = project(x + 1, y + 1, z, size);
            const b3 = project(x, y + 1, z, size);

            ctx.lineWidth = 1;
            ctx.strokeStyle = STROKE;
            ctx.lineJoin = 'round';

            // Top face
            ctx.fillStyle = palette.top;
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Left face
            ctx.fillStyle = palette.left;
            ctx.beginPath();
            ctx.moveTo(p3.x, p3.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(b2.x, b2.y);
            ctx.lineTo(b3.x, b3.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Right face
            ctx.fillStyle = palette.right;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(b2.x, b2.y);
            ctx.lineTo(b1.x, b1.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
         }

         function drawFloorBoundary(baseSize, currentGap, time, hoverProgress) {
            // Floor boundary expands with breathing and hover
            const pad = 0.55 + hoverProgress * 0.45;
            const halfExtent = (N / 2) * (1 + currentGap) + pad;
            const zFloor = -0.12;

            const corner1 = project(-halfExtent, -halfExtent, zFloor, baseSize);
            const corner2 = project(halfExtent, -halfExtent, zFloor, baseSize);
            const corner3 = project(halfExtent, halfExtent, zFloor, baseSize);
            const corner4 = project(-halfExtent, halfExtent, zFloor, baseSize);

            ctx.save();
            ctx.strokeStyle = FLOOR_STROKE;
            ctx.lineWidth = 1.25;
            // Moves clockwise during inhale and anti-clockwise during exhale
            const breathPhase = (time * 2 * Math.PI) / BREATH_PERIOD;
            const dashOffset = Math.sin(breathPhase) * 28;
            ctx.setLineDash([4, 4]);
            ctx.lineDashOffset = dashOffset;

            ctx.beginPath();
            ctx.moveTo(corner1.x, corner1.y);
            ctx.lineTo(corner2.x, corner2.y);
            ctx.lineTo(corner3.x, corner3.y);
            ctx.lineTo(corner4.x, corner4.y);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
         }

         function drawLayerLabels(baseSize, currentGap, hoverProgress) {
            if (hoverProgress < 0.05) return;

            ctx.save();
            ctx.globalAlpha = Math.min(1, (hoverProgress - 0.05) * 1.5);
            ctx.font = '500 11px "SF Mono", ui-monospace, Menlo, Monaco, monospace';

            const centerOffset = (N - 1) / 2;
            const labelXExtent = (N - 1 - centerOffset) * (1 + currentGap) + 1.2;
            const labelYExtent = (0 - centerOffset) * (1 + currentGap);

            for (const label of LAYER_LABELS) {
               const zPos = label.k * (1 + currentGap + hoverProgress * EXPLODE_EXTRA) + 0.5;
               const anchor = project(labelXExtent, labelYExtent, zPos, baseSize);

               const lineStartX = anchor.x + 12;
               const lineEndX = anchor.x + 45;
               const textX = lineEndX + 10;
               const textY = anchor.y;

               const isBlue = label.blue;
               const strokeCol = isBlue ? '#3b82f6' : '#9ca3af';
               const textCol = isBlue ? '#2563eb' : '#4b5563';
               const borderCol = isBlue ? '#3b82f6' : '#e5e7eb';
               const bgCol = isBlue ? 'rgba(239, 246, 255, 0.95)' : 'rgba(255, 255, 255, 0.95)';

               // Connecting horizontal rule
               ctx.strokeStyle = strokeCol;
               ctx.lineWidth = 1;
               ctx.beginPath();
               ctx.moveTo(lineStartX, anchor.y);
               ctx.lineTo(lineEndX, anchor.y);
               ctx.stroke();

               // Label Box
               const textWidth = ctx.measureText(label.text).width;
               const boxWidth = textWidth + 18;
               const boxHeight = 22;
               const boxX = textX;
               const boxY = textY - boxHeight / 2;

               ctx.fillStyle = bgCol;
               ctx.strokeStyle = borderCol;
               ctx.beginPath();
               ctx.rect(boxX, boxY, boxWidth, boxHeight);
               ctx.fill();
               ctx.stroke();

               // Label Text
               ctx.fillStyle = textCol;
               ctx.textBaseline = 'middle';
               ctx.fillText(label.text, boxX + 9, textY);
            }
            ctx.restore();
         }

         const startTime = performance.now();

         function render(now) {
            const time = (now - startTime) / 1000;

            // Smooth hover interpolation
            const targetHover = hovered ? 1 : 0;
            hoverProgress += (targetHover - hoverProgress) * 0.08;

            // Breathing wave
            const breathT = 0.5 + 0.5 * Math.sin((time * 2 * Math.PI) / BREATH_PERIOD);
            const currentGap = GAP_MIN + (GAP_MAX - GAP_MIN) * breathT;

            // Compact scale for responsive UI embedding
            const baseSize = Math.min(width, height) / (N * 4.6);

            ctx.clearRect(0, 0, width, height);

            // Grid footprint center offset
            const centerOffset = (N - 1) / 2;

            // Bottom animated perimeter boundary
            drawFloorBoundary(baseSize, currentGap, time, hoverProgress);

            for (const cube of drawOrder) {
               const introT = easeOutCubic((time - cube.delay) / INTRO_DURATION);
               const dropOffset = (1 - introT) * cube.startDrop;

               const posX = (cube.i - centerOffset) * (1 + currentGap);
               const posY = (cube.j - centerOffset) * (1 + currentGap);
               const posZ = cube.k * (1 + currentGap + hoverProgress * EXPLODE_EXTRA) + dropOffset;

               const palette = cube.blue ? COLORS.blue : COLORS.white;
               drawCube(posX, posY, posZ, baseSize, palette);
            }

            // Hover layer annotations ("01 SOURCES", "02 LOGIC", "03 AGENTS", "04 SURFACES")
            drawLayerLabels(baseSize, currentGap, hoverProgress);

            requestAnimationFrame(render);
         }

         requestAnimationFrame(render);
      })();
   </script>
</body>

</html>
