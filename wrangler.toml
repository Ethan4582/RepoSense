name = "reposense-api"
main = "src/server/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[[workflows]]
name = "reposense-indexing"
binding = "INDEXING_WORKFLOW"
class_name = "IndexingWorkflow"

[triggers]
crons = ["* * * * *"]

[vars]
# Application and API URLs for CORS and redirect resolution
APP_URL = "https://reposense.pages.dev"
API_URL = "https://reposense-api.t7labs.workers.dev"

# Emergency circuit breaker: OFF | READ_ONLY | MAINTENANCE
EMERGENCY_MODE = "OFF"
# Conservative free-tier workload guards. These protect Cloudflare compute;
# model inference is paid through each user's own provider key.
MAX_GLOBAL_INDEXING_JOBS = "3"
MAX_DAILY_INDEXING_JOBS = "20"
MAX_DAILY_INDEXED_FILES = "50000"
INDEXING_BUSY_THRESHOLD_PERCENT = "80"
SERVER_BUSY_RETRY_SECONDS = "1800"

# Required Cloudflare Worker Secrets (Set with `npx wrangler secret put <NAME>` in production):
# - ENCRYPTION_KEY: 32-byte base64 or 64-char hex key used for AES-256-GCM BYOK encryption
# - DATABASE_URL: PostgreSQL connection string (Neon direct connection)
# - GITHUB_WEBHOOK_SECRET: GitHub App webhook signing secret
# - CLERK_SECRET_KEY: Clerk Backend API Secret Key
# - CLERK_PUBLISHABLE_KEY: Clerk Publishable Key
# - ASSEMBLYAI_API_KEY: (Optional) For meeting transcription
# - CLOUDINARY_API_KEY: (Optional) For meeting video/audio storage
# - CLOUDINARY_API_SECRET: (Optional)
# - CLOUDINARY_CLOUD_NAME: (Optional)

